name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare web assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          rsync -a --exclude '.git' --exclude '.github' --exclude 'android' ./ android/app/src/main/assets/www/
          cp android/web/index.html android/app/src/main/assets/www/index.html
          cp android/web/dungeonNES.js android/app/src/main/assets/www/dungeonNES.js
          python3 android/patch_main.py
          node --check android/app/src/main/assets/www/main.js
          node --check android/app/src/main/assets/www/dungeonNES.js
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ZeldaNesRevisited-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
