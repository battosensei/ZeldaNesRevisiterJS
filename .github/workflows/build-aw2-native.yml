name: Build Zelda The Minish Cap Joystick APK

on:
  push:
    branches:
      - chat/zelda-minish-joystick-apk-20261026
    paths:
      - ".github/workflows/build-aw2-native.yml"
      - "tools/patch-aw2-native.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Checkout native emulator source
        uses: actions/checkout@v4
        with:
          repository: TrebuchetDynamics/garnacha-boy-android
          ref: main
          path: native
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;22.1.7171670" "cmake;3.18.1"

      - name: Patch native app
        run: python3 tools/patch-aw2-native.py native/android

      - name: Build native mGBA APK
        shell: bash
        run: |
          set -euo pipefail
          cd native
          ./android/gradlew -p android --no-daemon :app:assembleBenchmark

      - name: Collect native APK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native/android/app/build/outputs/apk/benchmark/app-benchmark.apk dist/Zelda-Minish-Cap-Joystick-placeholder.apk
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          cp "$BUILD_TOOLS/lib/apksigner.jar" dist/apksigner.jar
          cp "$BUILD_TOOLS/zipalign" dist/zipalign
          chmod +x dist/zipalign

      - uses: actions/upload-artifact@v4
        with:
          name: zelda-minish-joystick-tooling
          path: dist/
          if-no-files-found: error
          retention-days: 1
