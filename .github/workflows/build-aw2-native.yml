name: Build Native Advance Wars 2 APK

on:
  push:
    branches:
      - chat/advancewars2-native-apk-20261024
    paths:
      - ".github/workflows/build-aw2-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout native emulator source
        uses: actions/checkout@v4
        with:
          repository: TrebuchetDynamics/garnacha-boy-android
          ref: main
          path: native
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;22.1.7171670" \
            "cmake;3.18.1"

      - name: Patch native app for bundled game
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("native/android")
          manifest = root / "app/src/main/AndroidManifest.xml"
          text = manifest.read_text()

          old_library = '''        <activity
              android:name=".LibraryActivity"
              android:exported="true"
              android:label="@string/app_name">
              <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>
          </activity>'''
          new_library = '''        <activity
              android:name=".LibraryActivity"
              android:exported="false"
              android:label="@string/app_name" />'''
          if old_library not in text:
              raise SystemExit("LibraryActivity manifest block not found")
          text = text.replace(old_library, new_library)

          old_main = '''        <activity
              android:name=".MainActivity"
              android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
              android:exported="false" />'''
          new_main = '''        <activity
              android:name=".MainActivity"
              android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
              android:exported="true"
              android:screenOrientation="landscape">
              <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>
          </activity>'''
          if old_main not in text:
              raise SystemExit("MainActivity manifest block not found")
          manifest.write_text(text.replace(old_main, new_main))

          java = root / "app/src/main/java/com/trebuchetdynamics/emulator/app/MainActivity.java"
          src = java.read_text()
          src = src.replace(
              "import java.io.IOException;\nimport java.io.OutputStream;",
              "import java.io.IOException;\nimport java.io.InputStream;\nimport java.io.OutputStream;"
          )

          old = '''        library = new RomLibrary(getFilesDir());
          String requestedRomId = getIntent().getStringExtra(EXTRA_ROM_ID);'''
          new = '''        library = new RomLibrary(getFilesDir());
          installBundledRom();
          String requestedRomId = "advancewars2";'''
          if old not in src:
              raise SystemExit("MainActivity startup block not found")
          src = src.replace(old, new)

          anchor = '''    private void applyOrientation() {'''
          method = '''    private void installBundledRom() {
          final String romId = "advancewars2";
          File directory = new File(getFilesDir(), "roms");
          if (!directory.isDirectory() && !directory.mkdirs()) {
              throw new IllegalStateException("Could not create ROM directory");
          }
          File destination = new File(directory, romId + ".gba");
          if (!destination.isFile() || destination.length() != 8388608L) {
              File temporary = new File(directory, romId + ".tmp");
              try (InputStream in = getAssets().open("game.gba");
                   FileOutputStream out = new FileOutputStream(temporary)) {
                  byte[] buffer = new byte[64 * 1024];
                  int read;
                  while ((read = in.read(buffer)) != -1) {
                      out.write(buffer, 0, read);
                  }
                  out.getFD().sync();
              } catch (IOException e) {
                  temporary.delete();
                  throw new IllegalStateException("Could not install bundled ROM", e);
              }
              if (destination.exists() && !destination.delete()) {
                  temporary.delete();
                  throw new IllegalStateException("Could not replace bundled ROM");
              }
              if (!temporary.renameTo(destination)) {
                  temporary.delete();
                  throw new IllegalStateException("Could not finish bundled ROM install");
              }
          }
          try {
              library.record(
                  romId,
                  "Advance Wars 2 - Black Hole Rising",
                  RomSystem.GBA,
                  System.currentTimeMillis());
          } catch (IOException e) {
              throw new IllegalStateException("Could not register bundled ROM", e);
          }
      }

  '''
          if anchor not in src:
              raise SystemExit("MainActivity method anchor not found")
          java.write_text(src.replace(anchor, method + anchor))

          gradle = root / "app/build.gradle"
          g = gradle.read_text()
          marker = '''    buildTypes {'''
          if marker not in g:
              raise SystemExit("Gradle buildTypes marker not found")
          g = g.replace(marker, '''    androidResources {
          noCompress 'gba'
      }

      buildTypes {''')
          gradle.write_text(g)

          assets = root / "app/src/main/assets"
          assets.mkdir(parents=True, exist_ok=True)
          (assets / "game.gba").write_bytes(b"\0" * 8388608)
          PY

      - name: Build native mGBA APK
        shell: bash
        run: |
          set -euo pipefail
          cd native
          ./android/gradlew -p android --no-daemon :app:assembleBenchmark

      - name: Collect native APK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native/android/app/build/outputs/apk/benchmark/app-benchmark.apk dist/AdvanceWars2-native-placeholder.apk
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          cp "$BUILD_TOOLS/lib/apksigner.jar" dist/apksigner.jar
          cp "$BUILD_TOOLS/zipalign" dist/zipalign
          chmod +x dist/zipalign

      - uses: actions/upload-artifact@v4
        with:
          name: advancewars2-native-tooling
          path: dist/
          if-no-files-found: error
          retention-days: 1
