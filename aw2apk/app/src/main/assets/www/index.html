<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Advance Wars 2</title>
  <style>
    html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
    body{position:fixed;inset:0}
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    window.EJS_player = "#game";
    window.EJS_gameName = "Advance Wars 2 - Black Hole Rising";
    (function () {
      try {
        if (!window.AndroidRom) throw new Error("Native ROM bridge unavailable");
        var total = window.AndroidRom.getRomSize();
        if (!total || total < 1024) throw new Error("Native ROM unavailable");
        var bytes = new Uint8Array(total);
        var chunkSize = 256 * 1024;
        for (var offset = 0; offset < total; offset += chunkSize) {
          var want = Math.min(chunkSize, total - offset);
          var b64 = window.AndroidRom.getRomChunk(offset, want);
          if (!b64) throw new Error("ROM chunk unavailable at " + offset);
          var binary = atob(b64);
          for (var i = 0; i < binary.length; i++) bytes[offset + i] = binary.charCodeAt(i);
        }
        window.EJS_gameUrl = bytes;
      } catch (e) {
        window.EJS_gameUrl = "game.gba";
      }
    })();
    window.EJS_core = "gba";
    window.EJS_biosUrl = "";
    window.EJS_pathtodata = "data/";
    window.EJS_startOnLoaded = true;
    window.EJS_askBeforeExit = false;
    window.EJS_threads = false;
    window.EJS_disableAutoLang = false;
    window.EJS_color = "#c62828";
  </script>
  <script src="data/loader.js"></script>
</body>
</html>
